[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-routing-harness"
version = "0.1.0"
description = "Apple Silicon CPU-only Dynamo routing benchmark harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dynamo-routing-lab = "dynamo_routing_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
