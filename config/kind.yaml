kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dynamo-routing
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30800
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      dynamo-sim.local/gpu-capacity: simulated
